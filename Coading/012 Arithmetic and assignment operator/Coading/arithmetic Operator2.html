## Arithmetic Operators in JavaScript

```html
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Arithmetic Operators</title>
    </head>
    <body>

        <script>

            // Arithmetic Operators ->  +, -, *, /, %, **, ++, --

            // 1. Addition (+) -> যোগ
            var a = 10;
            var b = 5;
            console.log("Addition: " + a + b);

            // 2. Subtraction (-) -> বিয়োগ
            var c = 10;
            var d = 5;
            console.log("Substraction: " + c - d); 

            // 3. Multiplication (*) -> গুণ
            var e = 10;
            var f = 5;
            console.log("Multiplication: " + e * f);

            // 4. Division (/) -> ভাগ
            var g = 10;
            var h = 5;
            console.log("Division: " + g / h);

            // 5. Modulus (%) -> ভাগশেষ নির্ণয়
            var i = 10;
            var j = 3;
            console.log("Modulus: " + i % j);

            // 6. Exponentiation (**) -> ঘাত বা পাওয়ার
            var k = 2;
            var l = 3;
            console.log("Exponent: " + k ** l);

            // 7. Increment (++) -> ১ বৃদ্ধি করা

            // Pre-Increment
            var m = 5;
            console.log("Pre-Increment: " + ++m);  

            // Post-Increment
            var n = 5;
            console.log(n++);  
            console.log("Post-Increment: " + n);    

            // 8. Decrement (--) -> ১ হ্রাস করা

            // Pre-Decrement
            var o = 5;
            console.log("Pre-Decrement: " + --o);  

            // Post-Decrement
            var p = 5;
            console.log(p--);  
            console.log("Post-Decrement: " + p);    

        </script>

    </body>
</html>
