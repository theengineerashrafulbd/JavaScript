<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Assignment Operators</title>
    </head>
    <body>

        <script>

            // Assignment Operators -> =, +=, -=, *=, /=, %=, **=

            // 1. Assignment (=)
            var a = 10;
            console.log("Assignment: " + a);  

            // 2. Addition Assignment (+=)
            var b = 5;
            b += 3;  // এর মানে b = b + 3
            console.log("Addition Assignment: " + b);  

            // 3. Subtraction Assignment (-=)
            var c = 10;
            c -= 4;  // এর মানে c = c - 4
            console.log("Subtraction Assignment: " + c);  

            // 4. Multiplication Assignment (*=)
            var d = 4;
            d *= 5;  // এর মানে d = d * 5
            console.log("Multiplication Assignment: " + d);  

            // 5. Division Assignment (/=)
            var e = 20;
            e /= 4;  // এর মানে e = e / 4
            console.log("Division Assignment: " + e); 

            // 6. Modulus Assignment (%=)
            var f = 10;
            f %= 3;  // এর মানে f = f % 3
            console.log("Modulus Assignment: " + f);  

            // 7. Exponentiation Assignment (**=)
            var g = 2;
            g **= 3;  // এর মানে g = g ** 3
            console.log("Exponentiation Assignment: " + g);  

        </script>

    </body>
</html>
