<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Arithmetic and Assignment Operator</title>
    </head>
    <body>
        
        <script>

            //Arithmetic operatror  ->  +, -, *, /, % (Modulus), ** (Exponent/power), ++ (Increment: pre, post increment), -- (Decrement: pre, post decrement)

            //Assignment operator   ->  =, +=, -=, *=, /=, %=, **=,

            var x = 3;
            x += 6  // এর মানে x = x + 6
            console.log(x);

            var y = 4;
            y *= 5;   // এর মানে হয় y = y *5
            console.write(y);

        </script>

    </body>
</html>
