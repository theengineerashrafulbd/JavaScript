<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>13.3: Calculate HW</title>
    </head>
    <body>
        
        <script>

            var num1 = prompt("Enter First Number : ");  //String input হবে
            var num2 = prompt("Enter Second Number : ");

            num1 = parseInt(num1, 10);  //String কে Int এ covert করবে
            num2 = parseInt(num2, 10);

            var sum, sub, multi, divi, modu;

            sum = num1 + num2;
            sub = num1 - num2;
            multi = num1 * num2;
            divi = num1 / num2;
            modu = num1 % num2;

            document.write("Enter first Number : " + num1 + "<br>");
            document.write("Enter Second Number : " + num2 + "<br><br>");

            document.write(num1 + " + " + num2 + " = " + sum + "<br>");
            document.write(num1 + " - " + num2 + " = " + sub + "<br>");
            document.write(num1 + " * " + num2 + " = " + multi + "<br>");
            document.write(num1 + " / " + num2 + " = " + divi + "<br>");
            document.write(num1 + " % " + num2 + " = " + modu);

        </script>

    </body>
</html>
