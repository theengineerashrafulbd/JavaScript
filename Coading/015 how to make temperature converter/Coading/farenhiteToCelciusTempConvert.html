<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Farenhite Temparature</title>
    </head>
    <body>
        

        <script>

            var cels = parseFloat(prompt("Enter Celsius: "));

            var farn = (cels * (9 / 5)) + 32;

            document.write("Fahrenheit = " + farn);

        </script>
    </body>
</html>
