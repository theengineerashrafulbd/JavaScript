
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Relational Operator</title>
    </head>
    <body>

        <script>

            // Relational Operator
            // >, >=, <, <=, ==, ===, !=, !==

            var num1 = parseFloat(prompt("Enter num1: "));
            var num2 = parseFloat(prompt("Enter num2: "));

            document.write("Num1 is: " + num1 + "<br>");
            document.write("Num2 is: " + num2 + "<br>");

            // Greater than (বড় কি না)
            document.write("Greater than: " + (num1 > num2) + "<br>");

            // Greater than or equal (বড় অথবা সমান কি না)
            document.write("Greater than or equal: " + (num1 >= num2) + "<br>");

            // Less than (ছোট কি না)
            document.write("Less than: " + (num1 < num2) + "<br>");

            // Less than or equal (ছোট অথবা সমান কি না)
            document.write("Less than or equal: " + (num1 <= num2) + "<br>");

            // Equal (Value সমান কি না)
            document.write("Equal: " + (num1 == num2) + "<br>");

            // Strict Equal (Value এবং Data Type সমান কি না)
            document.write("Strict Equal: " + (num1 === num2) + "<br>");

            // Not Equal (Value সমান নয় কি না)
            document.write("Not Equal: " + (num1 != num2) + "<br>");

            // Strict Not Equal
            document.write("Strict Not Equal: " + (num1 !== num2) + "<br>");

        </script>

    </body>
</html>
