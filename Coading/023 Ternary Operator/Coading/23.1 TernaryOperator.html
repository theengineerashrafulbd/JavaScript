<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>23.1: Ternary Opeator</title>
    </head>
    <body>
        


        <script>

            var number = Number(prompt("Enter a number: "));

            /*
            //general if, else using....
            if(number >= 0){
                document.write("Positive");
            }

            else{
                document.write("Negative");
            }
            */


            // Ternary Operator using for two Conditions....

            /*
            //Style-1 of Ternary Operator
            number > 0 ? document.write("Positive") : document.write("Negative");
            */

            //Style-2 of Ternary Operator
            document.write(number > 0 ? "Positive" : "Negative");

            /*
            //Style-3 of Ternary Operator
            var result = number > 0 ? "Positive" : "Negative"
            document.write(result);
            */

        </script>
    </body>
</html>
