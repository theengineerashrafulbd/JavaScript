<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Vowel or Consonant</title>
    </head>
    <body>

        <script>

            // Task 5 - input a letter and check it is vowel or consonant using switch

            var letter = prompt("Enter any letter : ");

            letter = letter.toLowerCase();

            switch (letter) {

                case "a":
                    document.write(letter + " is a Vowel");
                    break;

                case "e":
                    document.write(letter + " is a Vowel");
                    break;

                case "i":
                    document.write(letter + " is a Vowel");
                    break;

                case "o":
                    document.write(letter + " is a Vowel");
                    break;

                case "u":
                    document.write(letter + " is a Vowel");
                    break;

                default:
                    document.write(letter + " is a Consonant");

            }

        </script>
    </body>
</html>
