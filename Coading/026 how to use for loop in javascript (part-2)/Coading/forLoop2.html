<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>25.2: for Loop in JavaScript</title>
    </head>
    <body>
        


        <script>

            //1 + 2 + 3 + 4 + 5 = ?
            var sum = 0;
            for(var x = 1; x<=5; x++){
                sum = sum + x;
            }

            document.write("Sum1: " + sum);

            //line break
            document.write("<br><br>");

            //input নিয়ে sum
            var m = parseFloat(prompt("Enter first number: "));  //parseFloat() / parseInt() না দিলে input String হিসেবে use হবে
            var n = parseFloat(prompt("Enter second number: "));

            var sum2 = 0;

            for(var x = m; x <= n; x++){
                sum2 = sum2 + x;
            }

            document.write("Sum2: " + sum2)


            //দুইটার যোগফল কে বারবার for loop দিয়ে চালানো হয়েছে
                for (var x = 1; x <= 5; x++) {
                var num1 = parseInt(prompt("Enter first number : "));
                var num2 = parseInt(prompt("Enter second number : "));
                var sum = num1 + num2;
                console.log("Result = " + sum);
            }

        </script>
    </body>
</html>
