<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>27.2: While Loop</title>
    </head>
    <body>
        


        <script>

            //Write a program that will print sum of all the numbers that are divisible by 3 and 5 from 1 to 100
            var i = 1;
            var sum = 0;

            while(i <= 100){
                if(i % 3 == 0 && i % 5 == 0){
                    
                    document.write(" " + i);  // এটা দিয়ে কোন কোন number গুলা ৩ এবং ৫ দ্বারা ভাগ করা যায় সেগুলো print করে দেখাবে

                    sum = sum + i;
                }
                
                i = i + 1;

            }

            //Line Breaking
            document.write("<br><br>");  

            document.write("Sum = " + sum);

        </script>
    </body>
</html>
