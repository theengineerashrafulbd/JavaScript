            //while loop: 1 to 100 number print
            var i = 1;  //while loop এ variables, initial value আগেই দিতে হবে
            while(i <= 100){   //while এর ভিতরে শুধু condition দিতে হবে
                document.write(" " + i);
                i++;  //update part print এর পরে দিতে হবে। i = i + 1  ei vabeo dewa jabe but পুরা while এর function same হবে 
            }
