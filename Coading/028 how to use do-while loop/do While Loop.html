<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>28.1: Do While Loop</title>
    </head>
    <body>
        


        <script>

            /*
            //cpmpare করার জন্য while loop use করা হয়েছে
            var i = 1;
            while(i <= 10){
                document.write(" " + i);
                i++;
            }
            */


            //do while loop
            var i = 1;
            do {
                document.write(" " + i);
                i++;
            } while(i <= 10);

        </script>
    </body>
</html>
