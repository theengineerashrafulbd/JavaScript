<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>29.1: Break, Continuity</title>
    </head>
    <body>
        


        <script>

            // break
            for (var i = 1; i <= 100; i++) {
                if (i == 10) {
                    break;   //break document.write() এর আগে হওয়ায় i=10 hole break করে দেয় যার জন্য i=10 আর  document.write() পর্যন্ত যেতে পারে না
                }

                document.write(" " + i);  //1-9 print হবে
            }

            document.write("<br> <br>");

            // continue
            for (var i = 1; i <= 100; i++) {
                if (i == 10) {
                    continue;   //if(condition) এর value i=10 এর জন্য condition true হওয়ায় সে 10 print না করে for(condition) এ পাঠিয়ে দেবে 
                                //অর্থাৎ continue - document.write() এর আগে হওয়ায় এর যে value এর জন্য condition true হবে সেটা শুধু print হবে না 
                }

                document.write(" " + i);  //1-100 print হবে without 10
            }

        </script>
    </body>
</html>
