<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Fizzbuzz Challenge</title>
    </head>
    <body>
        


        <script>

            // FizzBuzz Challenge

            for (let i = 1; i <= 100; i++) {

                if (i % 5 === 0 && i % 3 === 0) {
                    console.log(`FizzBuzz\n`);
                } else if (i % 3 === 0) {
                    console.log(`Fizz\n`);
                } else if (i % 5 === 0) {
                    console.log(`Buzz\n`);
                } else {
                    console.log(`${i}\n`);
                }
            }

        </script>
    </body>
</html>
