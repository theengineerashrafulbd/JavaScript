            // Function 3: Square
            function square(num) {
                var result = num * num;
                document.write("Square Result: " + result + "<br>"); 
            }
            square(5);
            square(6);
            square(7);


            //line break within two function
            document.write("<br>");

            // Practice 4: Multiplication
            function multiply(num1, num2) {
                var result = num1 * num2;
                document.write("Multiply Result: " + result + "<br>");
            }
            multiply(5, 6);
            multiply(6, 7);
            multiply(7, 8);


            document.write("<br>");


            //practise 5: using return 
            function divide(num5, num6){
                var result5 = num5 / num6;
                return result5;
            }
            //calling function
            document.write("Divide result: " + divide(10, 2));

            /*
            //calling function using in diffrent ways (Source: from practise 5)
            var x = divide(10, 2);
            document.write(x);

        </script>
