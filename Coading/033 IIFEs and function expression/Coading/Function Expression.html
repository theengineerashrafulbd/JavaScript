            /*
            IIFEs (Immediately Invokeable Function Expressions)

            (function display(message) {
               console.log(message);
             })('hi');

            */

            /*
            // IIFEs (Immediately Invokeable Function Expressions)

             (function display(message) {

             */





            //Part 2: Function Expression

            // Function Expression: 3
            var display = function() {
                console.log("Hello World");
            };

            display();
