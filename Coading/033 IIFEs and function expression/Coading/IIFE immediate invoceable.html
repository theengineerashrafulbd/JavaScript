<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>33.2: IIFE Immediate Invoceable</title>
    </head>
    <body>
        


        <script>

            // IIFE Immediate Invoceable: Sum of two numbers
            (function() {

                var num1 = 10;
                var num2 = 20;

                var sum = num1 + num2;

                document.write("Sum = " + sum);

            })();

            document.write("<br>");

            //example 2: IIFE Immediate Invoceable function
           (function display(message){
                document.write(message);
            }) ("Hello");

        </script>
    </body>
</html>
